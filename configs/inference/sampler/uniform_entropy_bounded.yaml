# @package sampler
# Entropy-bounded sampling with revisable commitments (freeze: false), as used for uniform
# recipes: a row ends when all its positions are selected in the same step.
_target_: core.samplers.entropy_bounded.EntropyBoundedSampler
steps: 1024
epsilon: 0.001
entropy_bound: 0.0
precision: float64
freeze: false
greedy_clean_estimate: true
