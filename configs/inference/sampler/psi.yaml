# @package sampler
# Ψ-sampler (Duo II, arXiv 2602.21185) for masked recipes and hybrids with a masked or
# uniform discrete view: the ancestral posterior mixed with forward re-noising of x_θ,
# weighted by κ_t from a ReMDM schedule. eta=0 is the ancestral sampler (greedy terminal
# decode, float64 probabilities as AncestralSampler). Continuous views keep their native
# update. One network call per step; see docs/components/psi-sampler.md.
_target_: core.samplers.composed.ComposedSampler
steps: 127
epsilon: 1.0e-05
tokens:
  _target_: core.samplers.policies.TokenSelection
  mode: posterior
positions:
  _target_: core.samplers.policies.AllPositions
transition:
  _target_: core.samplers.psi.PsiTransition
  schedule: rescale   # rescale | cap | loop
  eta: 0.02
  t_on: 0.55          # loop only
  t_off: 0.05         # loop only
  alpha_on: 0.9       # loop only: the held keep rate α(t_on)
commitment: none
final_denoise: greedy
precision: float64
