# @package _global_
# Fixed-block BlockGen baseline, not the multi-block-size mixture model.
# Paper: https://arxiv.org/abs/2606.02241
# Reference: jdeschena/blockgen @ 6f52b0da3aa961d7cd268fe2d7c20cd94b3f51ae
# Use token-causal clean-stream attention for these BlockGen presets.
# For mixture training use blockgen_masked_mixture / blockgen_uniform_mixture.
# Mixture likelihood evaluation and ARPC/EIPC are not implemented.
# Task, tokenizer, budget and batching remain independently configurable.
defaults:
- override /model: dit_conditioned
- override /noise_schedule: log_linear
- override /time_sampler: antithetic
- _self_
algorithm:
  time_conditioning: false
self_conditioning:
  enabled: false
block_diffusion:
  enabled: true
  block_size: 16
  x0_causal: true
  clean_loss: none
  cache_clean_prefix: true
noise_schedule:
  epsilon: 0.001
time_sampler:
  epsilon: 0.001
  antithetic: true
parameterization:
  temperature: 1.0
sampler:
  # 15 reverse updates + terminal decode = 16 NFE per generated block.
  # Total sequence NFE sums over blocks; this is not a 16-NFE whole sequence.
  steps: 15
  epsilon: 0.001
  final_denoise: ancestral
