# @package _global_
defaults:
  - sudoku_duo
  - override /algo: uniform_diffusion
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sudoku_eval]

data:
  difficulty: hard

sampling:
  predictor: ancestral_cache
  steps: 180

callbacks:
  sudoku_eval:
    every_n_train_steps: 1000
    subset_size: 128
    batch_size: 64
    num_steps: 180
    seed: 42
    log_examples: 8
    full_eval_at_end: true
    samplers:
      - name: ancestral
        predictor: ancestral_cache
        noise_removal: greedy
        greedy_clean_estimate: true
      - name: eb_0p1
        predictor: uniform_entropy_bounded
        entropy_bound: 0.1
        greedy_clean_estimate: true
