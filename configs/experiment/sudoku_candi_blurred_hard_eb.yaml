# @package _global_
defaults:
  - override /data: sudoku
  - override /model: tiny
  - override /algo: candi_blurred
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sudoku_eval]

model:
  length: 180
  hidden_size: 512

data:
  difficulty: hard

loader:
  global_batch_size: 256

trainer:
  max_steps: 20000
  val_check_interval: 20000

eval:
  generate_samples: false

sampling:
  predictor: candi_entropy_bounded
  entropy_bound: 0.1
  steps: 180

callbacks:
  sudoku_eval:
    every_n_train_steps: 1000
    subset_size: 128
    batch_size: 64
    num_steps: 180
    seed: 42
    log_examples: 8
    full_eval_at_end: false
