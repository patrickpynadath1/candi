# @package _global_
defaults:
  - override /data: sudoku
  - override /model: tiny
  - override /algo: candi_ra_change

model:
  length: 180
  hidden_size: 512
algo:
  min_percentile: 0.05
  max_percentile: 0.4
loader:
  global_batch_size: 256
trainer:
  max_steps: 5000
  val_check_interval: 5000
  check_val_every_n_epoch: null
eval:
  generate_samples: false
