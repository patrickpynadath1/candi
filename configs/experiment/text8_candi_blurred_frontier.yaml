# @package _global_
defaults:
  - override /algo: candi_blurred
  - override /callbacks: [checkpoint_every_n_steps, learning_rate_monitor, text8_sampling]

# Everything else comes from config_text8_frontier.yaml.
algo:
  output_embedding_dim: 256

eval:
  # The named callback owns sampling so the normal validation pass only logs
  # the matched likelihood metrics once.
  generate_samples: false

sampling:
  predictor: candi_entropy_bounded
  entropy_bound: 0.1
  greedy_clean_estimate: true
  steps: 128

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 1000
  text8_sampling:
    every_n_train_steps: 1000
    num_samples: 128
    batch_size: 128
    num_steps: 128
    samplers:
      - name: ancestral_temp
        predictor: candi
        temperature: 1.0
      - name: eb_0p1_greedy
        predictor: candi_entropy_bounded
        temperature: 1.0
        entropy_bound: 0.1
        greedy_clean_estimate: true
