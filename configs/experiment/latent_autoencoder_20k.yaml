# @package _global_
# Select task=battery/text8 or task=battery/tinystories at composition time.
defaults:
- latent_autoencoder
- override /task: battery/text8
- _self_
seed: 1
output_dir: ${oc.env:CANDI_STORAGE_ROOT,${oc.env:DUO_CACHE,${oc.env:HOME}/.cache/duo}}/outputs/latent-autoencoder-20k-20261101/${preparation.task_name}
loader:
  global_batch_size: 256
  eval_batch_size: 8
training:
  warmup_steps: 2500
trainer:
  max_steps: 20000
  accumulate_grad_batches: 32
  val_check_interval: 32000
  limit_val_batches: 16
  enable_progress_bar: false
checkpoint:
  every_n_steps: 1000
  save_top_k: 1
callback:
  every_n_steps: 1000
  subset_size: 16
sampler:
  # 14 ODE updates + terminal denoiser + token decoder, per block.
  steps: 14
wandb:
  entity: rz-text-dlp
  project: latent-autoencoder-20k-20261101
  name: ${preparation.task_name}-encoder8-denoiser8-decoder8-seed1
