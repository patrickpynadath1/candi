# @package _global_
# Continuous REPLAiD as a recipe over GaussianDiffusion (no family class); see
# docs/methods/replaid.md for what each component contributes.
defaults:
- override /denoising_task/algorithm: gaussian_diffusion
- override /information_path/representation: embedding
- override /denoising_task/model: continuous_dit
- override /denoising_task/model/input@model.input: linear
- override /denoising_task/model/output@model.output: adaln
- override /denoising_task/parameterization: gaussian_prior
- override /information_path/process: gaussian
- override /information_path/noise_schedule: plaid_log_snr
- override /denoising_task/time_sampler: adaptive_allocation
- override /denoising_task/objective: gaussian_elbo
- override /inference/sampler: gaussian_ddpm
- override /information_path/token_space@token_space: data_only
algorithm:
  # Corrupt prompts too (noisy prompt inpainting); Sudoku presets set false.
  corrupt_all: true
noise_schedule:
  # Variance-minimizing shape gradient from the ELBO's diffusion term.
  adaptation_term: diffusion
representation:
  dimension: 16
  trainable: true
  project_after_update: true
model:
  input:
    preconditioning: unit_embedding
    bias: false
  time:
    coordinate: negative_log_snr
    input_projection: true
  self_conditioning:
    initialization: default
    # sqrt(state_dim): feedback on the unit-embedding scale.
    scale: unit_embedding
self_conditioning:
  enabled: true
  source: posterior_mean
  probability: 0.25
  evaluation_probability: 1.0
prediction:
  selection: fixed_count
  # Self-conditioned rows train only the denoiser; uncorrupted positions feed
  # back their clean embedding.
  selected_gradients: denoiser_only
  fixed_feedback: clean
optimizer:
  groups:
  - patterns:
    - own_views.0.representation.table
    - own_views.0.schedule.input_weight
    - own_views.0.schedule.bias
    - own_views.0.schedule.output_weight
    lr: 0.01
    weight_decay: 0.0
  - patterns:
    - own_views.0.schedule.gamma_min
    - own_views.0.schedule.gamma_max
    lr: 0.01
    weight_decay: 0.1
sampler:
  prior_mode: standard_normal
  prompt_mode: noisy
  self_conditioning_mode: bootstrap
  final_transition_noise: true
