# @package _global_
defaults:
  - override /data: sudoku
  - override /model: tiny_sphere_dit
  - override /algo: sfm
  - override /noise: log-linear-adaptive

algo:
  invert_time_convention: false
  auto_truncation: true
noise:
  adaptive_coordinate: physical
  # Filled by SFM from vocabulary size, spherical embedding dimension, and delta.
  alpha_max: null
  adaptive_buffer_size: 12800
  adaptive_refit_every: 50
  adaptive_ema: 0.9
  adaptive_uniform_mix: 1.0e-3
loader:
  global_batch_size: 256
  num_workers: 8
training:
  loss_precision: bf16
trainer:
  accumulate_grad_batches: 1
  check_val_every_n_epoch: null
  max_steps: 20000
  val_check_interval: 20000
  limit_val_batches: 0.0
eval:
  generate_samples: false
