# @package _global_
# Shared model/evaluation specification for Gaussian and blurring comparisons.
model:
  hidden_size: 768
  cond_dim: 128
  n_blocks: 12
  n_heads: 12
  dropout: 0.1
  input:
    preconditioning: none
    bias: true
  time:
    coordinate: time
  output:
    output_dim: 768
representation:
  dimension: 128
  feature_lambda_min: 0.25
  feature_lambda_max: 1000000000.0
parameterization:
  temperature: 0.1
time_sampler:
  adaptive: true
sampler:
  steps: 512
