# @package _global_
defaults:
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, gsm8k_eval]
  - override /data: tiny-gsm
  - override /model: tinygsm_20m
  - override /algo: ar
loader:
  global_batch_size: 512
data:
  streaming: true
  validation_examples: 2048
  shuffle_buffer_size: 10000
trainer:
  max_steps: 250000
  val_check_interval: 1000
eval:
  generate_samples: false
gsm8k:
  scoring: code
