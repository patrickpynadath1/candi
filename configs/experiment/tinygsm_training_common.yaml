# @package _global_
# Matched to the locally configured TinyGSM blockgen training recipe.
defaults:
- override /task: tinygsm
- override /lr_scheduler: constant_warmup
- _self_
seed: 1
data:
  separator: \n
  wrap: false
  streaming: false
  train_on_prompt: false
  train_on_pad: true
  filter_too_long: true
  val_ratio: 0.01
  val_seed: 42
task:
  length: 512
self_conditioning:
  enabled: true
  source: hidden
  probability: 0.9
  evaluation_probability: 1.0
block_diffusion:
  enabled: false
  block_size: 16
  x0_causal: false
  clean_loss: none
  cache_clean_prefix: true
loader:
  global_batch_size: 512
  eval_batch_size: 64
  num_workers: 16
training:
  ema: 0.9999
  warmup_steps: 2500
optimizer:
  lr: 0.0003
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
trainer:
  devices: 8
  num_nodes: 1
  accumulate_grad_batches: 8
  precision: bf16-mixed
  max_steps: 250000
  gradient_clip_val: 1.0
  val_check_interval: 10000
  limit_val_batches: 500
  log_every_n_steps: 100
checkpoint:
  every_n_steps: 10000
callback:
  every_n_steps: 10000
  subset_size: 128
  seed: 42
  batch_size: 4
evaluation:
  use_ema: true
time_sampler:
  epsilon: 0.001
  antithetic: true
