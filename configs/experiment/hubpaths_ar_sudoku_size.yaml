# @package _global_
# Match sudoku_ar: 8 blocks, width 512, 8 heads, batch 256, 20k updates.
defaults:
  - hubpaths_ar
model:
  length: 82
  hidden_size: 512
  cond_dim: 128
  n_blocks: 8
  n_heads: 8
data:
  prepared_dir: ${hydra:runtime.cwd}/data_cache/hubpaths/language_like_100k_seed0
loader:
  global_batch_size: 256
  eval_global_batch_size: 128
trainer:
  max_steps: 20000
  val_check_interval: 1000
  check_val_every_n_epoch: null
callbacks:
  hubpaths_eval:
    every_n_train_steps: 1000
    subset_size: 16
    samples_per_prompt: 16
  checkpoint_every_n_steps:
    every_n_train_steps: 1000
    save_top_k: 0
    save_last: true
sampling:
  predictor: ar_cached
wandb:
  project: hubpaths
  group: language-like-sudoku-sized-ar
  name: hubpaths-ar-language-like-100k-20k-seed1
