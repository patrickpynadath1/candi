# @package _global_
# python main.py +experiment=tinygsm_blockgen_uniform
# On one GPU: trainer.devices=1 trainer.accumulate_grad_batches=64
# Batch remains 512 globally / 8 per GPU per microstep.
# Uniform ELBO; no Gaussian curriculum or self-conditioning.
defaults:
- tinygsm_blockgen_common
- override /denoising_task/algorithm: uniform_diffusion
- override /denoising_task/model: dit_conditioned
- override /denoising_task/parameterization: plug_in
- override /information_path/process: uniform
- override /denoising_task/objective: uniform
- override /information_path/noise_schedule: log_linear
- override /denoising_task/time_sampler: antithetic
- override /inference/sampler: uniform_ancestral
- override /information_path/token_space@token_space: data_only
- _self_
algorithm:
  time_conditioning: false
parameterization:
  temperature: 0.1
sampler:
  steps: 16
