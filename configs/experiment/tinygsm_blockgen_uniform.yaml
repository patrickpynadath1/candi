# @package _global_
# python main.py +experiment=tinygsm_blockgen_uniform
# On one GPU: trainer.devices=1 trainer.accumulate_grad_batches=64
# Batch remains 512 globally / 8 per GPU per microstep.
# Uniform ELBO; no Gaussian curriculum or self-conditioning.
defaults:
- tinygsm_blockgen_common
- override /algorithm: uniform_diffusion
- override /model: dit_conditioned
- override /parameterization: plug_in
- override /process: uniform
- override /objective: uniform
- override /noise_schedule: log_linear
- override /time_sampler: antithetic
- override /sampler: uniform_ancestral
- override /token_space@token_space: data_only
- _self_
algorithm:
  time_conditioning: false
parameterization:
  temperature: 0.1
sampler:
  steps: 16
