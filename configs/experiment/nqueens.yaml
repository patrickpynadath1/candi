# @package _global_
defaults:
- override /task: nqueens
model:
  hidden_size: 128
  cond_dim: 64
  n_blocks: 4
  n_heads: 4
loader:
  global_batch_size: 128
  eval_batch_size: 128
  num_workers: 0
trainer:
  max_steps: 10000
  val_check_interval: 1000
  accumulate_grad_batches: 1
training:
  warmup_steps: 100
checkpoint:
  every_n_steps: 1000
callback:
  every_n_steps: 1000
