# @package _global_
# Conditional REPLAiD hybrid as a recipe over HybridDiffusion (no family class):
# a Gaussian view on learned unit embeddings and a forced-target absorbing view
# share one local time drawn from a learned importance density; revealed tokens
# feed a clean-context input slot. See docs/methods/replaid-hybrid.md.
defaults:
- /information_path/hybrid_view@model.input.views.content: learned_log_snr_gaussian
- /information_path/hybrid_view@model.input.views.revealed: forced_target_mask
- override /denoising_task/model: continuous_dit
- override /denoising_task/model/input@model.input: revealed_context
- override /denoising_task/model/output@model.output: adaln
- override /information_path/representation: embedding
- override /denoising_task/parameterization: gaussian_prior
- override /information_path/token_space@token_space: data_only
- override /denoising_task/algorithm: hybrid_diffusion
- override /denoising_task/objective: hybrid_elbo
- override /denoising_task/time_sampler: piecewise_importance
- override /inference/sampler: revealed_hybrid
- _self_
algorithm:
  synchronize_committed: true
  # Both views read the importance sampler's quantile map, in training and
  # generation (one shared local time).
  adaptive_time_views: [0, 1]
representation:
  dimension: 16
  trainable: true
  project_after_update: true
self_conditioning:
  enabled: false
model:
  time:
    coordinate: negative_log_snr
    epsilon: 1.0e-30
    input_projection: true
  self_conditioning:
    enabled: false
optimizer:
  groups:
  - patterns:
    - model.input.views.0.representation.table
    - time_sampler.clock_logits
    lr: 0.01
    weight_decay: 0.0
  - patterns:
    - model.input.views.0.schedule.gamma_min
    - model.input.views.0.schedule.gamma_delta_raw
    lr: 0.01
    weight_decay: 0.0
