# @package _global_
# LangFlow-style: https://arxiv.org/abs/2604.11748
# Gumbel schedule, embedding Gaussian CE and self-conditioning. Still to align:
# embedding sqrt(D) normalization, gamma conditioning, skip connections and
# reference training details. Gumbel fitting uses our detached SGD update.
defaults:
- gaussian_base
- override /representation: embedding
- override /noise_schedule: gumbel
- _self_
self_conditioning:
  enabled: true
  source: posterior_mean
