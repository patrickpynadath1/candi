# @package _global_
defaults:
- permuted_autoregressive
- override /task: text8
model:
  hidden_size: 256
  n_blocks: 4
  n_heads: 8
  dropout: 0.1
loader:
  global_batch_size: 128
  eval_batch_size: 32
  num_workers: 2
training:
  warmup_steps: 200
  ema: 0.999
trainer:
  accumulate_grad_batches: 1
  max_steps: 10000
  val_check_interval: 1000
  limit_val_batches: 16
  num_sanity_val_steps: 0
checkpoint:
  every_n_steps: 10000
callback:
  every_n_steps: 0
