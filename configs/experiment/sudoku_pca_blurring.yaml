# @package _global_
# Feature PCA only; positional DCT blur is deliberately not composed here.
defaults:
- corruption_factorial
- /information_path/time_map: cdcd_loss_cdf
- override /information_path/hybrid_view@model.views.content: pca_blurring
- override /task: sudoku
- override /inference/sampler: forward_resampling
- override /denoising_task/time_sampler: antithetic
- _self_
# CDCD's learned loss CDF as the content view's time map (training and
# generation); the training time sampler draws uniform coordinator times.
algorithm:
  adaptive_time_views: [0]
  time_map: ${time_map}
time_sampler:
  epsilon: 0.001
time_map:
  epsilon: 0.001
self_conditioning:
  enabled: false
trainer:
  max_steps: 20000
  precision: bf16-mixed
  accumulate_grad_batches: 4
loader:
  global_batch_size: 256
training:
  warmup_steps: 2500
  performance:
    compile:
      enabled: true
sampler:
  steps: 127
  greedy_clean_estimate: false
  final_denoise: greedy
# Reuse the established cache; do not regenerate Sudoku data.
data:
  cache_dir: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/data_cache
  num_train: 48000
  num_valid: 2000
  data_seed: 42
optimizer:
  lr: 0.0003
lr_scheduler:
  warmup_steps: 2500
