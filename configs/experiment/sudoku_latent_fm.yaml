# @package _global_
defaults:
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sudoku_eval]
  - override /data: sudoku
  - override /model: latent_split_tiny
  - override /algo: latent_fm
loader:
  global_batch_size: 256
trainer:
  max_steps: 20000
  val_check_interval: 20000
sampling:
  predictor: latent_fm
  steps: 90
  latent_feedback: soft
  feedback_temperature: 1.0
eval:
  generate_samples: false
