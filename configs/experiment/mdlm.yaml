# @package _global_
# MDLM core recipe: https://arxiv.org/abs/2406.07524
# Uses the shared masked model and weighted CE; budgets/backbone are local defaults.
defaults:
- override /inference/sampler: ancestral
- _self_
# Keep DiT's learned modulation/gates even when MDLM receives constant time.
model:
  time:
    adaLN: true
