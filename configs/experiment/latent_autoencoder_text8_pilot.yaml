# @package _global_
# Single-GPU functional pilot; generation costs 16 model calls per block.
defaults:
- latent_autoencoder
- override /task: battery/text8
- _self_
seed: 1
output_dir: ${oc.env:CANDI_STORAGE_ROOT,${oc.env:DUO_CACHE,${oc.env:HOME}/.cache/duo}}/outputs/latent-autoencoder-text8-pilot-20261101
loader:
  global_batch_size: 256
  eval_batch_size: 8
training:
  warmup_steps: 200
trainer:
  max_steps: 2000
  accumulate_grad_batches: 32
  val_check_interval: 3200
  limit_val_batches: 16
  enable_progress_bar: false
checkpoint:
  every_n_steps: 500
  save_top_k: 2
callback:
  every_n_steps: 100
  subset_size: 16
sampler:
  steps: 14
wandb:
  entity: rz-text-dlp
  project: latent-autoencoder-text8-pilot-20261101
  name: text8-encoder8-denoiser8-decoder8-seed1
