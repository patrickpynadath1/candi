# @package _global_
defaults:
- tinygsm_sc_common
- override /algorithm: hybrid_diffusion
- override /model: hybrid
- override /parameterization: unconstrained_posterior
- override /objective: cross_entropy
- override /time_sampler: loss_derivative
- override /sampler: hybrid
- override /hybrid_view@model.views.first: simplex
- override /hybrid_view@model.views.second: gaussian
- _self_
model:
  backbone:
    hidden_size: 768
    cond_dim: 128
    n_blocks: 12
    n_heads: 12
    dropout: 0.1
    adaLN: true
    tie_word_embeddings: false
parameterization:
  temperature: 0.1
time_sampler:
  adaptive: true
sampler:
  steps: 16
