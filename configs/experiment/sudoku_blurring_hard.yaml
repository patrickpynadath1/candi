# @package _global_
defaults:
  - override /data: sudoku
  - override /model: tiny
  - override /algo: blurring_diffusion
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sudoku_eval]

model:
  length: 180
  hidden_size: 512

data:
  difficulty: hard

loader:
  global_batch_size: 256

trainer:
  max_steps: 20000
  val_check_interval: 20000

sampling:
  predictor: blurring_ode
  steps: 64
  # If true, every reverse step embeds argmax x0 tokens instead of the
  # posterior-mean probability blend. This changes sampling only.
  greedy_clean_estimate: false
  omit_reblur: false

callbacks:
  sudoku_eval:
    every_n_train_steps: 1000
    subset_size: 128
    batch_size: 64
    num_steps: 64
    seed: 42
    log_examples: 8
    full_eval_at_end: false
