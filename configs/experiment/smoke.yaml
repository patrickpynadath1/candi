# @package _global_
model:
  hidden_size: 32
  cond_dim: 16
  n_blocks: 1
  n_heads: 4
  dropout: 0.0
data:
  num_train: 8
  num_valid: 2
loader:
  global_batch_size: 4
  eval_batch_size: 2
  num_workers: 0
  pin_memory: false
training:
  warmup_steps: 1
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  accumulate_grad_batches: 2
  max_steps: 2
  val_check_interval: 2
  log_every_n_steps: 1
  num_sanity_val_steps: 0
checkpoint:
  every_n_steps: 1
callback:
  every_n_steps: 0
evaluation:
  device: cpu
  max_examples: 2
