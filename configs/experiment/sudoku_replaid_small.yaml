# @package _global_
# A small conditional RePlaid baseline, initialized from scratch.
defaults:
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sudoku_eval]
  - override /data: sudoku
  - override /model: tiny
  - override /algo: replaid
  - override /strategy: single_gpu

data:
  difficulty: hard

algo:
  clean_context: true

model:
  length: 180
  hidden_size: 128
  cond_dim: 128
  n_blocks: 4
  n_heads: 4
  dropout: 0.0

loader:
  global_batch_size: 128
  eval_global_batch_size: 128
  num_workers: 2

training:
  warmup_steps: 100
  ema: 0.999
  sampling_eps: 0.0

trainer:
  devices: 1
  accumulate_grad_batches: 1
  precision: bf16-mixed
  max_steps: 2000
  val_check_interval: 500
  check_val_every_n_epoch: null
  limit_val_batches: 8
  num_sanity_val_steps: 0

sampling:
  predictor: replaid_ddpm
  steps: 180

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 500
  sudoku_eval:
    every_n_train_steps: 500
    subset_size: 128
    batch_size: 64
    num_steps: 180
    seed: 42
    log_examples: 0
    full_eval_at_end: false

checkpointing:
  resume_from_ckpt: false

eval:
  generate_samples: false

wandb:
  project: replaid-sudoku
  entity: rz-text-dlp
  name: replaid-hard-d128-l4-2k-seed1
  group: hard-sudoku-small
  job_type: train
  tags: [replaid, sudoku_hard, small]
