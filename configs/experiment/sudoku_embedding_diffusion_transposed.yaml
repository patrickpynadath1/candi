# @package _global_
defaults:
  - override /data: sudoku
  - override /model: tiny
  - override /algo: embedding_diffusion

model:
  length: 180
  hidden_size: 512
  transpose_hidden_size: 512
  coordinate_position_encoding: none

data:
  difficulty: hard

algo:
  backbone: transposed_cont_dit

loader:
  global_batch_size: 256

trainer:
  max_steps: 20000
  val_check_interval: 20000

eval:
  generate_samples: false
