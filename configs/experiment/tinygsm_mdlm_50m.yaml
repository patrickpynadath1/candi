# @package _global_
defaults:
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, gsm8k_eval]
  - override /data: tiny-gsm
  - override /model: tinygsm_50m
  - override /algo: mdlm

loader:
  global_batch_size: 64
  eval_global_batch_size: 64
  num_workers: 1

data:
  streaming: true
  validation_examples: 2048
  shuffle_buffer_size: 10000
  train_on_pad: false

algo:
  mask_after_added_tokens: true

trainer:
  max_steps: 20000
  val_check_interval: 1000
  num_sanity_val_steps: 0
  limit_val_batches: 8

sampling:
  predictor: entropy_bounded
  entropy_bound: 0.1
  steps: 32

eval:
  generate_samples: false

gsm8k:
  scoring: code
