# @package _global_
# BlockGen-uniform single-block-size baseline, task independent.
# The reference uses plug-in uniform ELBO, NOT our uniform posterior-CE recipe.
# No Gaussian curriculum. See blockgen_common.yaml for mixture presets,
# remaining limitations and per-block NFE accounting.
defaults:
- blockgen_common
- override /denoising_task/algorithm: uniform_diffusion
- override /denoising_task/parameterization: plug_in
- override /information_path/process: uniform
- override /denoising_task/objective: uniform
- override /inference/sampler: uniform_ancestral
- override /information_path/token_space@token_space: data_only
- _self_
