# @package _global_
defaults:
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, gsm8k_eval]
  - override /data: tiny-gsm
  - override /model: tinygsm_50m
  - override /algo: ar
loader:
  global_batch_size: 512
data:
  streaming: true
  validation_examples: 2048
  shuffle_buffer_size: 10000
algo:
  # The 10k-step 20M sweep peaked at 13.28% with AR temperature 0.2.
  temp: 0.2
trainer:
  max_steps: 150000
  val_check_interval: 1000
eval:
  generate_samples: false
gsm8k:
  scoring: code
