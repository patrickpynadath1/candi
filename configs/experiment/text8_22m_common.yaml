# @package _global_
seed: 23
task:
  length: 256
  num_eval_samples: 256
model:
  backbone:
    hidden_size: 512
    cond_dim: 128
    n_blocks: 6
    n_heads: 8
    dropout: 0.1
    adaLN: true
loader:
  global_batch_size: 512
  eval_batch_size: 16
  num_workers: 4
training:
  ema: 0.999
  warmup_steps: 200
optimizer:
  lr: 0.0003
trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  accumulate_grad_batches: 4
  max_steps: 5000
  log_every_n_steps: 20
  enable_progress_bar: false
  num_sanity_val_steps: 0
  val_check_interval: 4000
  check_val_every_n_epoch: null
  limit_val_batches: 32
checkpoint:
  every_n_steps: 1000
  save_top_k: 2
callback:
  every_n_steps: 1000
  subset_size: 64
sampler:
  steps: 128
  final_denoise: sample
