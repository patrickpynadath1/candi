# @package _global_
# python main.py +experiment=tinygsm_blockgen_masked
# On one GPU: trainer.devices=1 trainer.accumulate_grad_batches=64
# Batch remains 512 globally / 8 per GPU per microstep.
# This codebase keeps posterior normalization in FP32. Validation reports CE,
# whereas upstream switches masked validation to the ELBO.
defaults:
- tinygsm_blockgen_common
- override /denoising_task/algorithm: mdlm
- override /denoising_task/model: dit
- override /denoising_task/parameterization: posterior
- override /information_path/process: absorbing
- override /denoising_task/objective: cross_entropy
- override /information_path/noise_schedule: log_linear
- override /denoising_task/time_sampler: antithetic
- override /inference/sampler: ancestral
- _self_
algorithm:
  time_conditioning: false
parameterization:
  temperature: 0.1
sampler:
  steps: 16
