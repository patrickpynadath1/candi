defaults:
- /noise_schedule@schedule: blurring
_target_: core.modifiers.hybrid.views.DiffusionView
process:
  _target_: core.processes.blurring.BlurringProcess
representation:
  _target_: core.representations.noisy_inputs.ProjectedRepresentation
  state_dim: 128
  hidden_size: ${model.backbone.hidden_size}
  precondition: false
  state_representation:
    _target_: core.representations.embedding.EmbeddingRepresentation
    vocab_size: ${task.vocab_size}
    dimension: 128
    trainable: true
    unit_normalized: true
update:
  _target_: core.samplers.hybrid_updates.BlurringPosteriorUpdate
