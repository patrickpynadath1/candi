_target_: core.modifiers.hybrid.views.DiffusionView
process:
  _target_: core.processes.gaussian.GaussianProcess
schedule:
  _target_: core.noise_schedules.gaussian_rank.OneHotRankSchedule
  vocab_size: ${task.vocab_size}
  sigma_min: 0.2
  sigma_max: 4.0
  min_percentile: 0.01
  max_percentile: 0.4
  num_points: 1000
  training_epsilon: 0.001
  inversion: analytic
  coupling: linear
  normalization: vocabulary
representation:
  _target_: core.representations.noisy_inputs.ProjectedRepresentation
  state_dim: ${task.vocab_size}
  hidden_size: ${model.backbone.hidden_size}
  state_representation:
    _target_: core.representations.one_hot.OneHotRepresentation
    vocab_size: ${task.vocab_size}
update:
  _target_: core.samplers.hybrid_updates.GaussianPosteriorUpdate
