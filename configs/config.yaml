defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: lm1b-gpt2
  - /model: small
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant_warmup
  - /prior: none
  - /algo: candi 

mode: train  # train / ppl_eval / sample_eval / dataset_entropy / sudoku_eval / gsm8k_eval

reasoning:
  output_dir: ${cwd:}/reasoning_eval
  batch_size: 8
  max_examples: null
  split: test

sudoku:
  output_dir: ${cwd:}/sudoku_eval
  batch_size: 64
  max_examples: null

gsm8k:
  input_file: null
  output_dir: ${cwd:}/gsm8k_eval
  scoring: numeric  # numeric (safe default) / code (isolated subprocess)
  timeout: 3.0
  bootstrap_size: 1
  max_examples: null
  subset_seed: 42

seed: 1
self_conditioning:
  enabled: false
  probability: 0.9
time_sampling:
  adaptive: false
  buffer_size: 65536
  bins: 50
  grid_size: 1000
  warmup: 1000
  refit_every: 50
  momentum: 0.9
scratch_dir:  /home/patrick/.cache/discrete_diffusion
batch_size: 512
loader:
  global_batch_size: ${batch_size}
  eval_global_batch_size: 128
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  num_workers: 4
  # Workers may start after CUDA initialization (especially during validation).
  multiprocessing_context: spawn
  pin_memory: True

sampling:
  predict_correct: false
  predictor: ancestral_cache  # ancestral_cache (only for MDLM), ancestral, analytic
  steps: 1024
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  use_float64: True
  p_nucleus: 1.0
  entropy_bound: 0.0  # gamma for the entropy_bounded MDLM sampler
  entropy_untempered: false  # rank EB acceptance with temperature-1 probabilities
  greedy_clean_estimate: false  # argmax accepted clean predictions in EB samplers
  trace_argmax_changes: false  # compare clean-prediction argmax across sampler NFEs
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  loss_precision: 'float32'  # bf16, float32, float64
  finetune_path: ''
  reset_ema_on_finetune: false

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json
  compute_eval_metrics: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 10
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 10000

wandb:
  project: cfm-lm1b-comp
  notes: 
  group: null
  job_type: null
  name: candi
  id: null
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}
    - ${algo.name}

hydra:
  run:
    dir: ${scratch_dir}/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
    # dir: /home/patrick/.cache/text8/text8/2025.04.26/000214/
  job:
    chdir: true

checkpointing:
  save_final: false
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
