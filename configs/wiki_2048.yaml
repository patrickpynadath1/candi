defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: wikipedia_en_clean_1024
  - /model: tiny
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant
  - /prior: none
  - /algo: ed_cosmos
  - /checkpoint_aliases: wikipedia
  - /tokenizers: wikipedia_en_clean
  - /token_budgets: wikipedia_en_clean

mode: train

seed: 1
scratch_dir: /home/patrick/.cache/discrete_diffusion
batch_size: 512
loader:
  global_batch_size: ${batch_size}
  eval_global_batch_size: 512
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  num_workers: 4
  pin_memory: True

sampling:
  predictor: ancestral_cache
  steps: 1024
  noise_removal: ancestral
  use_float64: True
  p_nucleus: 1.0
  num_sample_batches: 2
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  loss_precision: "float32"
  finetune_path: ""

eval:
  checkpoint_path: ""
  disable_ema: False
  compute_generative_perplexity: True
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  eval_model_source: local
  local_eval_checkpoint_path: ${checkpoint_aliases.ar_1024}
  local_eval_device: cuda
  local_eval_context_size: null
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: False
  generated_samples_path: ${cwd:}/samples.json
  compute_eval_metrics: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  precision: "bf16"
  num_sanity_val_steps: 2
  max_steps: 50000
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 0.5

wandb:
  project: wikipedia-vocab-control
  notes:
  group: null
  job_type: null
  name: null
  id: null
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}
    - ${algo.name}

hydra:
  run:
    dir: ${scratch_dir}/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  save_dir: ${cwd:}
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
