# Renoise, greedy: the argmax clean sequence is corrupted again with the forward
# process to the next noise level; only the terminal decode is searched.
# One nested-tuning inference policy (an entry of preparation.inference).
name: renoise_greedy
sampler:
  _target_: core.samplers.composed.ComposedSampler
  steps: 127
  epsilon: 1.0e-5
  tokens:
    _target_: core.samplers.policies.TokenSelection
    mode: greedy
  positions:
    _target_: core.samplers.policies.AllPositions
  transition:
    _target_: core.samplers.policies.ForwardCorruption
  commitment: none
  final_denoise: greedy
space:
  sampler.final_denoise:
  - greedy
  - sample
initial_points:
- sampler.final_denoise: greedy
- sampler.final_denoise: sample
trials: 2
budget_parameter: steps
