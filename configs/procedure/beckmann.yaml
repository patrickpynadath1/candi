# Autonomous directional transport + clean-boundary CE, not full paper curriculum.
# Algorithm must be MapAlgorithm(endpoint=true) with EndpointMap.
_target_: core.training.procedures.composition.Procedure
phases:
- _target_: core.training.procedures.composition.Phase
  states:
    _target_: core.training.procedures.map_training.MapTrainingStates
    warmup_steps: 0
  prediction:
    _target_: core.training.procedures.map_training.MapPredictions
    endpoint: true
  targets:
    _target_: core.training.procedures.map_training.MapTargets
    endpoint: true
    consistency_target:
      _target_: core.training.procedures.maps.DirectionalEndpointTarget
  objective:
    _target_: core.training.procedures.map_training.MapLoss
    consistency:
      _target_: core.training.procedures.losses.MeanSquaredError
  reduction:
    _target_: core.training.procedures.losses.MaskedMean
