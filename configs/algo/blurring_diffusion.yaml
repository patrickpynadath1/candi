name: blurring_diffusion
backbone: blurring_dit
causal_attention: false
parameterization: mean
T: 0
time_conditioning: true

# Small, normalized table for corruption and posterior-mean blending.
input_embedding_dim: 4
# Untied table used only to form vocabulary logits.
output_embedding_dim: 256
detach_forward_embedding: false
reserve_mask_embedding: false

# Split the common geometric heat time between positional merging and declared
# feature destruction. 1.0 exactly recovers the positional-only process.
feature_rho: 0.5
# Ascending rates: column 0 survives longest; the final column dies first.
# These are declared constants, never estimated from the learned table.
feature_lambda_min: 0.25
feature_lambda_max: 1.0e9
# Independent shifted-geometric clock. With rho=0.5, the slowest and fastest
# columns cross SNR=1 near t=0.9 and t=0.1 respectively.
feature_tau_min: 1.0e-9
feature_tau_max: 20.0
# Larger initial variance in slow columns; set to 0 for uniform-init ablation.
column_init_alpha: 0.25
# Record column norms every N optimizer steps (0 disables history collection).
column_norm_log_every: 100

basis: dct  # dct or isotropic (the load-bearing baseline)
# Geometric heat time is recomputed for each generated sequence length.
tau_schedule: geometric
# Reparameterize the complete Gaussian path so DCT modes cross SNR=1 at
# approximately uniform times. `none` recovers the original geometric clock.
time_warp: linearized_crossings
linearized_crossing_min: 0.05
linearized_crossing_max: 0.95
tau_min_attenuation: 0.01
terminal_nonzero_mode: 0.01
# Gives a worst-case terminal mean-mode SNR below 0.1 for Sudoku length 89.
terminal_mean: 0.03
lambda_scale: 1.0
# sigma(t) = t^noise_power: shared across modes, zero at the clean endpoint.
noise_power: 2.0
crossing_max_decile_fraction: 0.15
