name: block_diffusion
backbone: dit
causal_attention: true
parameterization: ar
time_conditioning: false
adaLN: true
T: 0
block_size: 8
noise_curriculum_steps: 100000
noise_curriculum_start_step: 0
noise_curriculum_end_step: null  # null preserves legacy 0 -> noise_curriculum_steps
max_noise_level: 1.0
noise_level_mode: monotone  # monotone / sequence_constant
clean_loss_weight: 0.5
logit_kl_weight: 0.0
logit_kl_direction: forward  # forward: KL(clean || noisy), reverse: KL(noisy || clean)
logit_kl_temperature: 1.0
logit_kl_position_weighting: noise  # none / noise
gradient_cosine_every: 0
embedding_scale: 1.0
rolling_update: euler  # euler / renoise
renoise_correlation: 0.0
rolling_warmup_steps: 8
rolling_refinement_steps: 0
rolling_x0_projection: soft  # soft / argmax
euler_tokens_per_step: 4
euler_nfe_budget: null
temp: 1.0
ignore_bos: false
