name: encoder_decoder_cosmos
backbone: encoder_decoder_cosmos
parameterization: subs
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
subs_masking: False
causal_attention: False
ignore_bos: False
loss_type: elbo
temp: 1.0

# cosmos encoder decoder settings

masked_denoiser_source: local # or hf 
masked_denoiser_path: ${checkpoint_aliases.masked_denoiser} # bert-base-uncased
latent_feature_dropout: .4
hr_vector_dropout: .3 
hr_vector_smoothing: .7
use_raw_tokens: False
