name: frm
backbone: frm_dit
parameterization: mean
time_conditioning: true
causal_attention: false
loss_type: flow
T: 0
ignore_bos: false

# Stage A uses conventional detached self-conditioning. Stage B overrides this
# with fpf and initializes from the Stage-A weights.
training_stage: self_condition
self_condition_probability: 0.5
fpf_rollout_probability: 0.5
fpf_rollout_depth: 16
supervised_states: 4
clamp_clues: true
