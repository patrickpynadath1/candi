name: cosmos_ldm
backbone: cosmos_denoiser
parameterization: subs
time_conditioning: False
T: 0  # continuous time in latent space
subs_masking: False
causal_attention: False
ignore_bos: False
loss_type: elbo
temp: 1.0
inner_steps: 4

encoder_decoder_path: ${checkpoint_aliases.cosmos_ed_v2}
latent_mode: encoder_decoder
is_cosmos: True

diffusion:
  use_self_cond: True
  is_conditional: False
  T: 1.0
  eps: 0.001
  t_min: 0.001

dynamic:
  N: 128
  solver: ddim
  scheduler: tanh
  d: 9.0
  ode_sampling: False

architecture:
  time_embedding:
    max_period: 10000

  unconditional_encoder:
    hidden_size: 256
    intermediate_size: 1024
    num_hidden_layers: 8
    num_attention_heads: 8
    attention_head_size: ${eval:'${.hidden_size} // ${.num_attention_heads}'}
    attention_probs_dropout_prob: 0.0
    max_position_embeddings: 128
    rope_theta: 10000
    layer_norm_eps: 1.0e-5

  conditional_encoder:
    hidden_size: 256
    intermediate_size: ${eval:'${.hidden_size} * 4'}
    num_hidden_layers: 4
    num_attention_heads: 8
    attention_head_size: ${eval:'${.hidden_size} // ${.num_attention_heads}'}
    attention_probs_dropout_prob: 0.0
    max_position_embeddings: ${model.length}
    rope_theta: 10000
    layer_norm_eps: 1.0e-5
