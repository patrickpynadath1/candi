name: encoder_decoder_plain
backbone: encoder_decoder_fsq
causal_attention: False
parameterization: mean
T: 0 # continuous time  
discretize_start_time: 1.0
time_conditioning: False
corruption_max_t: 0.3
corruption_type: masked # uniform or masked
smoothing_latent_noise: 0.7
subs_masking: False
vq_mode: ste

vq_loss_start: 1000 
vq_loss_warmup: 1000 
fsq_num_channels: 6
use_latent_interpolation: false
fsq: 
  _target_: vector_quantize_pytorch.FSQ
  levels: [8,8,8,5,5,5]