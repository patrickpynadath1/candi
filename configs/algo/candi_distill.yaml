name: candi_distill
backbone: cont_dit
causal_attention: False
scaling_factor: 1.0
t_min: .05
t_max: .95
inference_start_t: .99
inference_end_t: .001
confidence_threshold: .9
clean_reveal_ratio: 1.0
parameterization: mean
T: 0 # continuous time  
discretize_start_time: 1.0
time_conditioning: true
weighted_loss: true
grad_calc: soft
step_size: 1.0
use_mixed_mask: True 
top_k: 100 # doesnt get used
mixed_coeff: 0.5
use_actual_elbo: False
only_corrupt_rate: 0.5 # for this fraction of the batch, the model only sees fully corrupted inputs
max_percentile: .25
min_percentile: .01

sigma_min: .1
sigma_max: 4.0
use_percentile_scheduling: True 
temp: 5
use_cfg: False
pure_continuous: False
alpha_beta: 3.0
use_uniform_sampling: True
sampler: distilled

# distill hyperparam
number_steps: 128
distill_steps: 2
grow_every: 10000
base_path: /data/remote_cache/patrick/discrete_diffusion/text8/2025.09.19/054800/checkpoints/20-28500.ckpt 
max_distill_steps: 8
budget: 5000
adapt_every: 100
