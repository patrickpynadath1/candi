name: replaid_keep
backbone: replaid_dit
parameterization: mean
time_conditioning: true
causal_attention: false
loss_type: elbo
T: 1000
ignore_bos: false

embedding_dim: 16
gamma_min: -13.3
gamma_max: 5.0
schedule_hidden_dim: 16
self_condition_rate: 0.0
split_ema: 0.99
output_prior: true
special_lr: 1.0e-2
endpoint_weight_decay: 0.1

# RePlaid's continuous-time MSE, restricted to hidden positions. Clean kept
# tokens replace predicted self-conditioning.
loss_variant: mse
reveal_ce_weight: 0.0
reveal_strategy: sample
