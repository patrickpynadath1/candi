name: hybrid_embedding_map
backbone: embedding_wrapper
causal_attention: False
parameterization: mean
T: 0 # continuous time  
discretize_start_time: 1.0
time_conditioning: False
corruption_max_t: 0.3
corruption_type: masked # uniform or masked
smoothing_latent_noise: 0.7
subs_masking: False
vq_mode: ste

vq_loss_start: 1000 
vq_loss_warmup: 1000 
ema_threshold: 1000

encoder_decoder_path: ${checkpoint_aliases.plain_ae_16384_16}
# need to use the same nu
num_codes: 16384

vq: 
  _target_: vector_quantize_pytorch.VectorQuantize
  dim: ${model.hidden_size}
  codebook_size: 8192
  decay: 0.8
  commitment_weight: .25
  kmeans_init: true
  threshold_ema_dead_code: 2