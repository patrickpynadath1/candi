name: candi
backbone: cont_dit
causal_attention: False
parameterization: mean
T: 0 # continuous time  
discretize_start_time: 1.0
time_conditioning: true
step_size: 1.0
mixed_coeff: 0.5
max_percentile: .25
min_percentile: .01
  
sigma_min: .01
sigma_max: 2.0
temp: 1.0
pure_continuous: False
# Hybrid denoising uses plain token CE by default. Set to likelihood to recover
# the continuous-time -alpha'(t)/(1-alpha(t)) objective weighting.
hybrid_loss_weighting: none
is_embed: False 
use_percentile_scheduling: True # only affects inference schedule
cont_schedule_type: linear
cont_schedule_target: r
factorized_adaptive_schedule: false
curve_type: linear
curve_orientation: linear
curve_power: 1.0
curve_linear_mix: 0.01
curve_control_1: [0.333333, 0.333333]
curve_control_2: [0.666667, 0.666667]
curve_discrete_center: 0.7
curve_continuous_center: 0.3
curve_sharpness: 10.0
joint_loss_probe: false
joint_loss_bins: 100
joint_loss_smoothing_sigma: 3.0
joint_loss_min_effective_count: 5.0
joint_loss_log_every: 500
