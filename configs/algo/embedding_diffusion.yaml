name: cont_diff_embed
backbone: cont_dit
causal_attention: False
parameterization: mean
T: 0 # continuous time  
discretize_start_time: 1.0
time_conditioning: true
step_size: 1.0
mixed_coeff: 0.5
max_percentile: .25
min_percentile: .01
  
sigma_min: .01
sigma_max: 2.0
temp: 1.0
pure_continuous: True
# Used only by hybrid subclasses (CANDI embedding and SLERP).
# `likelihood` restores the continuous-time -alpha'/(1-alpha) weighting.
hybrid_loss_weighting: none
is_embed: True
reserve_mask_embedding: false
# ve: x_t = x_0 + sigma(t) * noise with an exponential sigma schedule.
# flow_matching: x_t = (1 - t) * x_0 + t * noise with t sampled uniformly.
continuous_path: ve
