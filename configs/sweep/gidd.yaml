# @package _global_
defaults:
- /experiment: corruption_factorial
- common
- /content_view: gidd
- /sc: 'off'
- override /task: battery/sudoku_hard
- _self_
model:
  backbone:
    n_blocks: 8
    hidden_size: 512
    cond_dim: 128
    n_heads: 8
    dropout: 0.1
preparation:
  family: gidd
  recipe_name: gidd-native-${hydra:runtime.choices.objective}-sc-${preparation.sc_name}
hydra:
  sweeper:
    params:
      objective: cross_entropy,gidd_elbo
      sc: off,on
      content_view: gidd
