# @package _global_
# Inference-only rerun of sc_vs_depth on its trained checkpoints (experiments/rerun):
# 27 cases: {Gaussian (CDCD clock), masked, uniform} x {8 layers,
# 8 layers + SC, 16 layers} x {Sudoku-hard, text8, TinyStories BPE-10k}. Also the runs
# experiments/sc-sampler-choice reads.
# The recipe, data cohort and seeds come from sc_vs_depth unchanged, so its checkpoints load
# as is. Policies: the five of hybrid_renoising, plus eb_churn and psi.
defaults:
- sc_vs_depth
- rerun_common
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi]
- _self_
preparation:
  name: sc-vs-depth-rerun
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/sc-vs-depth-rerun
  family: sc_vs_depth_rerun
  source_runs: ${preparation.source_root}/sc_vs_depth
  wandb:
    project: sc-vs-depth-rerun
