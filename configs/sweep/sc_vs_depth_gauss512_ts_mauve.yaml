# @package _global_
# TinyStories re-tune with MAUVE on TinyStories-33M features (docs/methods/
# tinystories-tuning-metric.md): the checkpoints and two-stage protocol of sc_vs_depth_gauss512, with the
# evaluation file experiments/rerun/evaluation/tinystories-bpe-10000-mauve.json, so the
# whole search (every trial, both stages) is guided by MAUVE. Samplers: hybrid_renoising, eb_churn, psi, psi_corruption, anchoring.
defaults:
- sc_vs_depth_gauss512
- rerun_common
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi, psi_corruption, anchoring]
- _self_
preparation:
  name: sc-vs-depth-gauss512-ts-mauve
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/sc-vs-depth-gauss512-ts-mauve
  family: sc_vs_depth_gauss512_ts_mauve
  evaluation_file: experiments/rerun/evaluation/${preparation.task_name}-mauve.json
  source_root: ${oc.env:SDDC_GAUSS512_RUNS,/data/sddc/runs/rerun-20261110}
  source_runs: ${preparation.source_root}/sc_vs_depth_gauss512
  source_case: ${preparation.task_name}-${preparation.recipe_name}-seed-${seed}-gauss512
  case_name: ${preparation.source_case}-mauve
  wandb:
    project: sc-vs-depth-gauss512-ts-mauve
hydra:
  sweeper:
    params:
      task: battery/tinystories_bpe
      ablation_path: gaussian_cdcd
