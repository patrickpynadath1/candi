# @package _global_
# Ψ re-tune after the κ fix (1486161: κ from the sampler's grid time, α = 1 - t, for every
# corruption): the same checkpoints and rerun protocol as continuous_schedules_gauss512, with only the psi policy.
# Analysis merges these Ψ results with the other samplers of continuous_schedules_gauss512 (same prompts and seeds)
# and re-selects by validation; this run's Ψ test score is reported only.
defaults:
- continuous_schedules_gauss512
- rerun_common
- override /inference/inference_policies: [psi]
- _self_
preparation:
  name: continuous-schedules-gauss512-psi2
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/continuous-schedules-gauss512-psi2
  family: continuous_schedules_gauss512_psi2
  source_root: ${oc.env:SDDC_GAUSS512_RUNS,/data/sddc/runs/rerun-20261110}
  source_runs: ${preparation.source_root}/continuous_schedules_gauss512
  source_case: ${preparation.task_name}-${preparation.recipe_name}-seed-${seed}-gauss512
  case_name: ${preparation.source_case}-psi2
  inference: []
  inference_overrides: null  # rerun_protocol's overrides name hybrid_renoising policies
  wandb:
    project: continuous-schedules-gauss512-psi2
hydra:
  sweeper:
    params:
      ablation_path: gaussian
