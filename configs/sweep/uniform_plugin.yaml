# @package _global_
defaults:
- /experiment: uniform_diffusion
- common
- /sc: 'off'
- override /task: battery/sudoku_hard
- _self_
model:
  n_blocks: 8
  hidden_size: 512
  cond_dim: 128
  n_heads: 8
  dropout: 0.1
preparation:
  family: uniform_plugin
  recipe_name: uniform-native-plugin-sc-${preparation.sc_name}
  inference:
  - name: native
    space:
      algorithm.predictor.temperature:
        type: float
        low: 0.5
        high: 1.5
      sampler.final_denoise:
      - ancestral
      - greedy
    initial_points:
    - algorithm.predictor.temperature: 1.0
    trials: 16
    budget_parameter: steps
hydra:
  sweeper:
    params:
      sc: off,on
