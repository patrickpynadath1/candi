# @package _global_
# Four fresh runs: canonical MDLM weighted CE, no SC, identical data/tuning.
defaults:
- /experiment: mdlm
- common
- /depth_mixing: baseline
- override /task: battery/sudoku_hard
- _self_
preparation:
  name: mdlm-depth-mixing-sudoku-20k-20261031
  output: ${oc.env:CANDI_STORAGE_ROOT,${oc.env:DUO_CACHE,${oc.env:HOME}/.cache/duo}}/plans/mdlm-depth-mixing-sudoku-20k-20261031
  family: mdlm_depth_mixing
  recipe_name: mdlm-${preparation.architecture_name}
  wandb:
    project: mdlm-depth-mixing-sudoku-20k-20261031
  # The MDLM algorithm uses discrete sampler adapters, not parallel-view adapters.
  inference:
  - name: native
    sampler:
      _target_: core.samplers.ancestral.AncestralSampler
      steps: 127
      epsilon: 1.0e-5
      final_denoise: greedy
    space:
      algorithm.predictor.temperature:
        type: float
        low: 0.5
        high: 1.5
    initial_points:
    - algorithm.predictor.temperature: 1.0
    trials: 16
    budget_parameter: steps
  - name: native_greedy
    sampler:
      _target_: core.samplers.ancestral.AncestralSampler
      steps: 127
      epsilon: 1.0e-5
      final_denoise: greedy
      greedy_clean_estimate: true
    space:
      sampler.final_denoise: [greedy, ancestral]
    trials: 2
    budget_parameter: steps
  - name: eb_greedy
    sampler:
      _target_: core.samplers.entropy_bounded.EntropyBoundedSampler
      entropy_bound: 0.1
      max_steps: 128
    space:
      algorithm.predictor.temperature:
        type: float
        low: 0.5
        high: 1.5
      sampler.entropy_bound:
        type: float
        low: 0.02
        high: 0.5
        log: true
    initial_points:
    - algorithm.predictor.temperature: 1.0
      sampler.entropy_bound: 0.1
    trials: 16
    budget_parameter: max_steps
self_conditioning:
  enabled: false
hydra:
  sweeper:
    params:
      task: battery/sudoku_hard
      depth_mixing: baseline,dca,mudd,attention
