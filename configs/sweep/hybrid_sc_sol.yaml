# @package _global_
# Inference-only rerun of hybrid-sc on its trained TinyStories checkpoints: SOL scoring,
# successive-halving sampler tuning and NFE budgets 128 and 512 as continuous_schedules_sol,
# with EB churn and the Ψ-sampler (applied to the masked or uniform discrete view; the
# continuous view keeps its native update) added to the policies.
# 2 discrete views x 4 continuous paths x {no SC, SC} = 16 cases.
# Protocol: experiments/sol-rerun/README.md.
defaults:
- hybrid_sc
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi]
- _self_
preparation:
  name: hybrid-sc-sol
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/hybrid-sc-sol
  family: hybrid_sc_sol
  evaluation_file: experiments/sol-rerun/evaluation/${preparation.task_name}.json
  source_runs: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/runs/hybrid-sc
  source_case: ${preparation.task_name}-${preparation.recipe_name}-seed-${seed}
  case_name: ${preparation.source_case}-sol
  training:
    space: {}
    trials: 1
    checkpoint: ${preparation.source_runs}/${preparation.source_case}/training/candidates/44136fa355b3678a1146/training/checkpoints/last.ckpt
  evaluation:
    nfe: [128, 512]
  wandb:
    project: hybrid-sc-sol
hydra:
  sweeper:
    params:
      task: battery/tinystories_bpe
