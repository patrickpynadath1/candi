# @package _global_
# 2 arms x 4 depths x 2 tasks = 16 runs; 8/8 repeats in both arms.
defaults:
- /experiment: e2d2
- common
- /scaling_arm: encoder
- override /task: battery/text8
- _self_
scaling:
  depth: 1
trainer:
  max_steps: 20000
  accumulate_grad_batches: 32
  val_check_interval: 32000
training:
  performance:
    activation_checkpointing: true
self_conditioning:
  enabled: false
preparation:
  name: e2d2-depth-scaling-20k-20261101
  output: ${oc.env:CANDI_STORAGE_ROOT,${oc.env:HOME}/.cache/candi}/plans/e2d2-depth-scaling-20k-20261101
  family: e2d2_depth_scaling
  recipe_name: e2d2-${preparation.arm}-${scaling.depth}
  recipe_fields: [scaling, model, encoder_decoder, block_diffusion, representation, algorithm, parameterization, objective, noise_schedule, time_sampler, prediction, self_conditioning, optimizer]
  wandb:
    project: e2d2-depth-scaling-20k-20261101
  inference:
  - name: native
    sampler:
      _target_: core.samplers.ancestral.AncestralSampler
      steps: 127
      epsilon: 1.0e-5
      final_denoise: greedy
    space:
      algorithm.predictor.temperature:
        type: float
        low: 0.5
        high: 1.5
    initial_points:
    - algorithm.predictor.temperature: 1.0
    trials: 16
    budget_parameter: steps
  - name: native_greedy
    sampler:
      _target_: core.samplers.ancestral.AncestralSampler
      steps: 127
      epsilon: 1.0e-5
      final_denoise: greedy
      greedy_clean_estimate: true
    space:
      sampler.final_denoise: [greedy, ancestral]
    trials: 2
    budget_parameter: steps
hydra:
  sweeper:
    params:
      task: battery/text8,battery/tinystories
      scaling_arm: encoder,decoder
      scaling.depth: 1,2,4,8
      '~training.performance.activation_checkpointing': 'true'
      '++training.performance.activation_checkpointing': 'true'
