# @package _global_
# TinyStories re-tune with MAUVE on TinyStories-33M features (docs/methods/
# tinystories-tuning-metric.md): the checkpoints and two-stage protocol of sc_vs_depth_rerun, with the
# evaluation file experiments/rerun/evaluation/tinystories-bpe-10000-mauve.json, so the
# whole search (every trial, both stages) is guided by MAUVE. Samplers: hybrid_renoising, eb_churn, psi, psi_corruption.
defaults:
- sc_vs_depth
- rerun_common
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi, psi_corruption]
- _self_
preparation:
  name: sc-vs-depth-ts-mauve
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/sc-vs-depth-ts-mauve
  family: sc_vs_depth_ts_mauve
  evaluation_file: experiments/rerun/evaluation/${preparation.task_name}-mauve.json
  source_runs: ${preparation.source_root}/sc_vs_depth
  case_name: ${preparation.source_case}-mauve
  evaluation:
    extra_test_nfe: []  # no NFE-512 check in this re-tune
  wandb:
    project: sc-vs-depth-ts-mauve
hydra:
  sweeper:
    params:
      task: battery/tinystories_bpe
      ablation_path: masked_elbo,uniform
