# @package _global_
# Inference-only rerun of hybrid_sc on its trained checkpoints (experiments/rerun):
# 48 cases: {masked, uniform} view x 4 continuous paths x {no SC, SC}
# x 3 tasks.
# The recipe, data cohort and seeds come from hybrid_sc unchanged, so its checkpoints load
# as is. Policies: the five of hybrid_renoising, plus eb_churn and psi.
defaults:
- hybrid_sc
- rerun_common
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi]
- _self_
preparation:
  name: hybrid-sc-rerun
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/hybrid-sc-rerun
  family: hybrid_sc_rerun
  source_runs: ${preparation.source_root}/hybrid_sc
  wandb:
    project: hybrid-sc-rerun
