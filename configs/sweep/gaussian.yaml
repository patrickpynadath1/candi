# @package _global_
defaults:
- /experiment: corruption_factorial
- common
- /information_path/gaussian_state: one_hot
- /information_path/path_schedule: adaptive
- /modifiers/sc: 'on'
- override /task: battery/sudoku_hard
- _self_
model:
  n_blocks: 8
  hidden_size: 512
  cond_dim: 128
  n_heads: 8
  dropout: 0.1
preparation:
  family: gaussian
  recipe_name: gaussian-${preparation.representation_name}-adaptive-cross_entropy-sc-${preparation.sc_name}
hydra:
  sweeper:
    params:
      information_path/gaussian_state: one_hot,embedding
