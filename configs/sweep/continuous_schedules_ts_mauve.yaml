# @package _global_
# TinyStories re-tune with MAUVE on TinyStories-33M features (docs/methods/
# tinystories-tuning-metric.md): the checkpoints and two-stage protocol of continuous_schedules_rerun, with the
# evaluation file experiments/rerun/evaluation/tinystories-bpe-10000-mauve.json, so the
# whole search (every trial, both stages) is guided by MAUVE. Samplers: hybrid_renoising, eb_churn, psi, psi_corruption, anchoring.
defaults:
- continuous_schedules
- rerun_common
- override /inference/inference_policies: [hybrid_renoising, eb_churn, psi, psi_corruption, anchoring]
- _self_
preparation:
  name: continuous-schedules-ts-mauve
  output: ${oc.env:SDDC_STORAGE_ROOT,${oc.env:HOME}/.cache/sddc}/plans/continuous-schedules-ts-mauve
  family: continuous_schedules_ts_mauve
  evaluation_file: experiments/rerun/evaluation/${preparation.task_name}-mauve.json
  source_runs: ${preparation.source_root}/continuous_schedules
  case_name: ${preparation.source_case}-mauve
  evaluation:
    extra_test_nfe: []  # no NFE-512 check in this re-tune
  wandb:
    project: continuous-schedules-ts-mauve
hydra:
  sweeper:
    params:
      task: battery/tinystories_bpe
      ablation_path: simplex,spherical,spherical_vmf
