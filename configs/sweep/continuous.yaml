# @package _global_
defaults:
- /experiment: corruption_factorial
- common
- /information_path/content_view: simplex
- /information_path/path_schedule: adaptive
- /modifiers/sc: 'off'
- override /task: battery/sudoku_hard
- _self_
model:
  n_blocks: 8
  hidden_size: 512
  cond_dim: 128
  n_heads: 8
  dropout: 0.1
preparation:
  family: continuous
  recipe_name: ${preparation.content_name}-adaptive-cross_entropy-sc-${preparation.sc_name}
hydra:
  sweeper:
    params:
      modifiers/sc: off,on
      information_path/content_view: simplex,spherical,vmf,blurring
