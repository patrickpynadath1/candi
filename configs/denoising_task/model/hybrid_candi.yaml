# @package model
_target_: core.models.modular.ModularDiT
vocab_size: ${token_space.model_vocab_size}
hidden_size: 512
cond_dim: 128
n_blocks: 8
n_heads: 8
dropout: 0.1
tie_word_embeddings: false
block_adaLN: true
time:
  _target_: core.models.modular.TimeConditioning
  _partial_: true
  coordinate: negative_log_keep
  adaLN: true
output:
  _target_: core.models.modular.AdaLNHead
  _partial_: true
  adaLN: true
self_conditioning:
  _target_: core.models.modular.SelfConditioning
  _partial_: true
  enabled: ${self_conditioning.enabled}
  source: ${self_conditioning.source}
  initialization: zero
views:
- _target_: core.modifiers.hybrid.views.DiffusionView
  update:
    _target_: core.samplers.hybrid_updates.DiscretePosteriorUpdate
  name: masking
  process:
    _target_: core.processes.candi_masking.CANDIMaskingProcess
    mask_index: ${token_space.mask_index}
  schedule:
    _target_: core.noise_schedules.log_linear.LogLinear
    epsilon: 0.001
  representation:
    _target_: core.representations.noisy_inputs.TokenRepresentation
    vocab_size: ${token_space.model_vocab_size}
    hidden_size: 512
    scale: 0.5
    normalize: true
- _target_: core.modifiers.hybrid.views.DiffusionView
  update:
    _target_: core.samplers.hybrid_updates.GaussianPosteriorUpdate
  name: gaussian
  process:
    _target_: core.processes.candi_gaussian.CANDIGaussianProcess
  schedule:
    _target_: core.noise_schedules.candi_rank.CANDIRankSchedule
    vocab_size: ${task.vocab_size}
    min_percentile: 0.05
    max_percentile: 0.4
  time_map:
    _target_: core.modifiers.hybrid.time_maps.LinearTimeMap
    scale: 0.999
  representation:
    _target_: core.representations.noisy_inputs.CANDIRepresentation
    state_dim: ${task.vocab_size}
    scale: 0.5
fusion:
  _target_: core.modifiers.hybrid.fusion.GatedFusion
  mask_index: ${token_space.mask_index}
  weights:
  - {masked: 1, revealed: 2}
  - {masked: 1, revealed: 0}
output_vocab_size: ${task.vocab_size}
