# Shared algorithm matrix: sudoku_rank.yaml. Batch sizes are conservative pilot values.
profiles:
  sudoku_extreme:
    task: sudoku_extreme
    full_training: true  # fixed-budget primary run uses all 1,000 released base puzzles
    prompt_length: 91
    length: 180
    batch_size: 64
    max_steps: 20000
    evaluations: [sudoku_extreme]
  sudoku_shah:
    task: sudoku_shah
    prompt_length: 91
    length: 180
    batch_size: 64
    max_steps: 20000
    evaluations: [sudoku_shah, sudoku_extreme]
  zebra_4x4:
    task: zebra
    layout: [4, 4]
    prompt_length: 476  # maximum packed prompt length, not a fixed answer offset
    length: 512
    batch_size: 16
    max_steps: 20000
    evaluations: [zebra_4x4]
  zebra_5x5:
    task: zebra
    layout: [5, 5]
    prompt_length: 476
    length: 512
    batch_size: 16
    max_steps: 20000
    evaluations: [zebra_5x5]
  zebra_mixed:
    task: zebra
    prompt_length: 476
    length: 512
    batch_size: 16
    max_steps: 20000
    evaluations: [zebra_mixed]
  maze_unique:
    task: maze_unique
    full_training: true  # fixed-budget primary run uses all 1,000 released mazes
    prompt_length: 902
    length: 1802
    batch_size: 4
    max_steps: 20000
    evaluations: [maze_unique]
