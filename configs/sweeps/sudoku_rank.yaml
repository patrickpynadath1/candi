# Explicit requested matrix: eight pure and eight hybrid configurations.
version: 2
difficulties: [easy, medium, hard]
seeds: [1, 2, 3]
modes: [pure, hybrid]
nfe: [16, 32, 64, 128, 256]
variants:
  embedding_linear_adaptive:
    label: Embedding Gaussian Adaptive
    modes: [pure]
    experiment: sudoku_candi_embedding
    overrides: [algo.interpolation_schedule=linear, noise.adaptive=true]
  embedding_geometric_rank:
    label: Embedding Gaussian Rank Geo
    modes: [pure, hybrid]
    experiment: sudoku_candi_embedding
    overrides: [algo.interpolation_schedule=geometric_rank]
  embedding_linear_rank:
    label: Embedding Gaussian Rank Linear
    modes: [pure, hybrid]
    experiment: sudoku_candi_embedding
    overrides: [algo.interpolation_schedule=linear_rank]
  slerp_truncated_adaptive:
    label: Spherical Truncated Adaptive
    modes: [pure]
    experiment: sudoku_candi_slerp
    overrides: [algo.interpolation_schedule=truncated_linear, noise.adaptive=true]
  slerp_geometric_rank:
    label: Spherical Truncated Rank Geo
    modes: [pure]
    experiment: sudoku_candi_slerp
    overrides: [noise.adaptive=false]
  onehot_gaussian_adaptive:
    label: Onehot Gaussian Adaptive
    modes: [pure]
    experiment: sudoku_onehot_gaussian
    overrides: [noise.adaptive=true]
  candi_geometric:
    label: Onehot Gaussian Rank Geo
    modes: [pure, hybrid]
    experiment: sudoku_candi_rank
    overrides: [algo.cont_schedule_type=geometric]
  candi_orig:
    label: Onehot Gaussian Rank Linear
    modes: [pure, hybrid]
    experiment: sudoku_candi_rank
    overrides: [algo.cont_schedule_type=linear]
  embedding_linear:
    label: Embedding Gaussian Linear Interpolation
    modes: [hybrid]
    experiment: sudoku_candi_embedding
    overrides: [algo.interpolation_schedule=linear]
  embedding_geometric_rank_adaptive:
    label: Embedding Gaussian Rank Geo + Adaptive
    modes: [hybrid]
    experiment: sudoku_candi_embedding
    overrides: [algo.interpolation_schedule=geometric_rank, noise.adaptive=true]
  slerp_geometric_rank_adaptive:
    label: SLERP Truncated Rank Geo + Adaptive
    modes: [hybrid]
    experiment: sudoku_candi_slerp
    overrides: [noise.adaptive=true]
  candi_geometric_adaptive:
    label: Onehot Rank Geo + Adaptive
    modes: [hybrid]
    experiment: sudoku_candi_rank
    overrides: [algo.cont_schedule_type=geometric, noise.adaptive=true]
