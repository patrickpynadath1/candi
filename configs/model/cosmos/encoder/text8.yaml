attention:
  head_size: 32
  num_heads: 8
  probs_dropout: 0.
  qk_norm: true
  implementation: "flash_attention_2"

embedding:
  dim: 256
  max_position_embeddings: ${model.k_register_latents}
  initializer_range: 0.02
aux_hidden_dim: 768
hidden:
  size: 256
  dropout: 0.1
  num_layers: 4
  ff_mult: 4

tokens:
  vocab_size: null

latent:
  dim: 256
  num_latents: ${model.k_register_latents}

normalization:
  layer_eps: 1.0e-5


augmentation:
  masking:
    encodings_mlm_probability: 0.3
    weight: 0.5

  gaussian_noise:
    delta: 0.7
    weight: 0.5

  latent_masking:
    probability: 0.4
    vae_beta: 0.0001
    vae_sigma: 1.0

  