defaults:
- /hybrid_view@views.first: gaussian
- /hybrid_view@views.second: masked

_target_: core.modifiers.hybrid.model.HybridModel
backbone:
  _target_: core.models.dit.DiT
  vocab_size: ${task.vocab_size}
  hidden_size: 512
  cond_dim: 128
  n_blocks: 8
  n_heads: 8
  dropout: 0.1
  adaLN: true
self_conditioning: ${self_conditioning.enabled}
self_conditioning_source: ${self_conditioning.source}
time_conditioning: identity
