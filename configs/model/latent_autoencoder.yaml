_target_: core.modifiers.latent_autoencoder.model.LatentAutoencoderModel
block_size: ${latent.block_size}
normalization:
  _target_: core.modifiers.latent_autoencoder.model.GaussianScaleNormalization
encoder:
  _target_: core.modifiers.latent_autoencoder.model.TokenLatentEncoder
  vocab_size: ${task.vocab_size}
  hidden_size: ${latent.hidden_size}
  n_blocks: ${latent.encoder_layers}
  n_heads: ${latent.n_heads}
  dropout: ${latent.dropout}
denoiser:
  _target_: core.modifiers.encoder_decoder.EncoderDecoderModel
  encoder_layers: 0
  model:
    _target_: core.modifiers.latent_autoencoder.model.LatentTransformer
    output_dim: ${latent.hidden_size}
    hidden_size: ${latent.hidden_size}
    n_blocks: ${latent.denoiser_layers}
    n_heads: ${latent.n_heads}
    dropout: ${latent.dropout}
    time_conditioning: true
decoder:
  _target_: core.modifiers.encoder_decoder.EncoderDecoderModel
  encoder_layers: 0
  model:
    _target_: core.modifiers.latent_autoencoder.model.LatentTransformer
    output_dim: ${task.vocab_size}
    hidden_size: ${latent.hidden_size}
    n_blocks: ${latent.decoder_layers}
    n_heads: ${latent.n_heads}
    dropout: ${latent.dropout}
    time_conditioning: false
