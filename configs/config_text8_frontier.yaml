defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, learning_rate_monitor]
  - /data: text8
  - /model: tiny
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant
  - /prior: none
  - /algo: mdlm
  - /tokenizers: text8

mode: train
seed: 1
scratch_dir: ${hydra:runtime.cwd}/new_runs
batch_size: 512

loader:
  global_batch_size: ${batch_size}
  eval_global_batch_size: 128
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes} * ${trainer.accumulate_grad_batches}}}
  num_workers: 4
  pin_memory: true

sampling:
  predictor: ancestral_cache
  steps: 128
  noise_removal: ancestral
  use_float64: true
  p_nucleus: 1.0
  num_sample_batches: 1
  num_sample_log: 2
  semi_ar: false
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: true
  importance_sampling: false
  sampling_eps: 1e-3
  change_of_variables: false
  loss_precision: float32
  finetune_path: ''

eval:
  checkpoint_path: ''
  disable_ema: false
  compute_generative_perplexity: false
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: false
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: true
  generated_samples_path: ${cwd:}/samples.json
  compute_eval_metrics: true

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  precision: bf16
  num_sanity_val_steps: 0
  max_steps: 5000
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 4000
  check_val_every_n_epoch: null

wandb:
  project: text8-tiny-dit-frontiers-5k
  notes: Comparable 5k-step tiny-DiT text8 frontier experiment
  group: text8-tiny-dit-5k
  job_type: train
  name: ${algo.name}-tiny-dit-text8-5k
  id: null
  tags:
    - text8
    - tiny-dit
    - 5k
    - ${algo.name}

hydra:
  run:
    dir: ${scratch_dir}/${algo.name}
  job:
    chdir: true

checkpointing:
  save_dir: ${cwd:}/new_runs/${algo.name}
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 1000
