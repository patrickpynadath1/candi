<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570">
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#edf8fb"/><stop offset="0.35" stop-color="#b2e2e2"/>
      <stop offset="0.68" stop-color="#66c2a4"/><stop offset="1" stop-color="#e34a33"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#172033"/></marker>
  </defs>
  <style>
    text { font-family: sans-serif; fill: #172033; }
    .box { fill: #fff; stroke: #aeb9cf; stroke-width: 2; }
    .arrow { stroke: #172033; stroke-width: 2; marker-end: url(#arrow); }
    .small { font-size: 13px; }
  </style>
  <rect width="1040" height="570" fill="#fbfcff"/>
  <text x="520" y="32" text-anchor="middle" font-size="24" font-weight="bold">Joint 100×100 loss-surface estimator</text>

  <g transform="translate(25,75)">
    <rect class="box" width="190" height="175" rx="10"/>
    <text x="95" y="28" text-anchor="middle" font-size="17" font-weight="bold">Factorized samples</text>
    <circle cx="45" cy="68" r="5" fill="#2b6cb0"/><circle cx="120" cy="90" r="5" fill="#2b6cb0"/>
    <circle cx="73" cy="125" r="5" fill="#2b6cb0"/><circle cx="155" cy="55" r="5" fill="#2b6cb0"/>
    <circle cx="145" cy="140" r="5" fill="#2b6cb0"/><circle cx="92" cy="52" r="5" fill="#2b6cb0"/>
    <text x="95" y="164" text-anchor="middle" class="small">record (d, c, loss)</text>
  </g>
  <path class="arrow" d="M220 162H260"/>

  <g transform="translate(270,60)">
    <rect class="box" width="235" height="205" rx="10"/>
    <text x="117" y="27" text-anchor="middle" font-size="17" font-weight="bold">Raw 100×100 bins</text>
    <rect x="35" y="42" width="165" height="145" fill="url(#heat)" stroke="#26334d"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.6">
      <path d="M51 42V187 M68 42V187 M84 42V187 M101 42V187 M117 42V187 M134 42V187 M150 42V187 M167 42V187 M183 42V187"/>
      <path d="M35 57H200 M35 71H200 M35 86H200 M35 100H200 M35 115H200 M35 129H200 M35 144H200 M35 158H200 M35 173H200"/>
    </g>
    <text x="117" y="201" text-anchor="middle" class="small">count, mean, variance per cell</text>
  </g>
  <path class="arrow" d="M510 162H550"/>

  <g transform="translate(560,60)">
    <rect class="box" width="220" height="205" rx="10"/>
    <text x="110" y="27" text-anchor="middle" font-size="17" font-weight="bold">Count-weighted smoothing</text>
    <rect x="36" y="45" width="148" height="140" fill="url(#heat)" filter="url(#blur)" stroke="#26334d"/>
    <circle cx="110" cy="115" r="20" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M110 115L127 102" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="110" y="202" text-anchor="middle" class="small">Gaussian radius σ = 3 cells</text>
  </g>
  <path class="arrow" d="M785 162H825"/>

  <g transform="translate(835,60)">
    <rect class="box" width="180" height="205" rx="10"/>
    <text x="90" y="27" text-anchor="middle" font-size="17" font-weight="bold">Outputs</text>
    <text x="18" y="62" class="small">• smoothed L(d,c)</text>
    <text x="18" y="88" class="small">• ∂L/∂d and ∂L/∂c</text>
    <text x="18" y="114" class="small">• gradient magnitude</text>
    <text x="18" y="140" class="small">• standard error</text>
    <text x="18" y="166" class="small">• reliability mask</text>
    <text x="18" y="192" class="small">• W&amp;B + JSON</text>
  </g>

  <g transform="translate(100,330)">
    <rect x="0" y="0" width="840" height="180" rx="12" fill="#eef3ff" stroke="#b8c6e8"/>
    <text x="420" y="30" text-anchor="middle" font-size="18" font-weight="bold">How a candidate curve uses the field</text>
    <path d="M65 135 C150 38,290 45,380 118 C500 190,670 65,775 45" fill="none" stroke="#805ad5" stroke-width="4"/>
    <g stroke="#172033" stroke-width="2" marker-end="url(#arrow)">
      <path d="M130 85l22 -30"/><path d="M270 73l12 35"/><path d="M430 140l30 -25"/>
      <path d="M590 123l-6 -38"/><path d="M710 70l30 18"/>
    </g>
    <text x="420" y="166" text-anchor="middle" class="small">Directional loss change: dL/ds = ∇L(C(s)) · C′(s); adaptive traversal tries to equalize its magnitude</text>
  </g>
</svg>
