name: tests

on:
  push:
    branches: [candiv2.1]
  pull_request:

jobs:
  test:
    # Linux x86_64: the platform the byte-level sampler snapshots were recorded on.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --python 3.10 --extra tuning --extra scoring --extra tracking --extra mazes
      - name: Lint
        run: uv run --locked ruff check core main.py frontier.py scripts/cluster
      - name: Test (CPU; CUDA-only tests skip)
        env:
          OMP_NUM_THREADS: "2"
        run: uv run --locked pytest -q -p no:cacheprovider core/tests
