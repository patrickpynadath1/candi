  epsilon: 1.0e-05
  final_denoise: greedy
lr_scheduler:
  _target_: core.training.schedules.constant_warmup
  warmup_steps: 250
self_conditioning:
  gradient_mode: detached
  enabled: false
  source: posterior_mean
  probability: 0.9
  evaluation_probability: 1.0
block_diffusion:
  enabled: true
  block_size: 32
  clean_loss: none
  clean_loss_weight: 1.0
  cache_clean_prefix: true
  max_length: null
  x0_causal: false
  context_memory:
