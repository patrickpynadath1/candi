algorithm:
  _target_: core.algorithms.mdlm.MDLM
  model: ${model}
  predictor: ${parameterization}
  process: ${process}
  schedule: ${noise_schedule}
  time_sampler: ${time_sampler}
  objective: ${objective}
  length: ${task.length}
  time_conditioning: false
  prediction: ${prediction}
model:
  _target_: core.models.dit.DiT
  vocab_size: ${token_space.model_vocab_size}
  hidden_size: 512
  cond_dim: 128
  n_blocks: 8
  n_heads: 8
  dropout: 0.1
  adaLN: false
  tie_word_embeddings: false
  self_conditioning: ${self_conditioning.enabled}
  self_conditioning_source: ${self_conditioning.source}
parameterization:
  _target_: core.parameterizations.posterior.PosteriorParameterization
  mask_index: ${token_space.mask_index}
  temperature: 1.0
  softcap: null
  top_k: 0
  top_p: 1.0
  commitment: greedy
prediction:
  _target_: core.modifiers.self_conditioning.prediction.PredictionCoordinator
  enabled: ${self_conditioning.enabled}
  source: ${self_conditioning.source}
  probability: ${self_conditioning.probability}
  evaluation_probability: ${self_conditioning.evaluation_probability}
  gradient_mode: ${oc.select:self_conditioning.gradient_mode,detached}
representation:
  _target_: core.representations.one_hot.OneHotRepresentation
  vocab_size: ${task.vocab_size}
  dimension: ${task.vocab_size}
process:
  _target_: core.processes.absorbing.AbsorbingProcess
  mask_index: ${token_space.mask_index}
objective:
  _target_: core.objectives.weighted_ce.WeightedCrossEntropy
time_sampler:
  _target_: core.time_sampling.uniform.UniformTimeSampler
  epsilon: 0.001
  antithetic: true
noise_schedule:
  _target_: core.noise_schedules.log_linear.LogLinear
  epsilon: 0.001
token_space:
  model_vocab_size:
