[project]
name = "duo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catalogue>=2.0.10",
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "flash-attn",
    "fsspec>=2026.2.0",
    "gradient-moment",
    "huggingface-hub>=1.15.0",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "numpy<2",
    "omegaconf>=2.3.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.0",
    "tokenizers>=0.22.2",
    "torch>=2.5.1",
    "torchdiffeq>=0.2.5",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "wandb>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
gradient-moment = { path = "../gradient-moment", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=8.39.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
