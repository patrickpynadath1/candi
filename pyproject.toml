[project]
name = "candi"
version = "2.1.0"
description = "Composable diffusion models for discrete data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "numpy<2",
    "omegaconf>=2.3.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.0",
    "torch>=2.5.1",
    "torchdiffeq>=0.2.5",
    "transformers>=5.8.1",
    "ray[tune]>=2.49,<3",
]

[project.optional-dependencies]
tracking = ["wandb>=0.27.0"]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.13"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
